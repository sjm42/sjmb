# Cargo.toml

[package]
name = "sjmb"
version = "1.15.1"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
description = "IRC bot"
repository = "https://github.com/sjm42/sjmb"
readme = "README.md"
keywords = ["irc", "bot"]
license = "MIT OR Apache-2.0"
edition = "2024"
resolver = "2"


[dependencies]
anyhow = "1.0"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
futures = "0.3"
html5ever = "0.40"
irc = { version = "1.1", default-features = false, features = ["ctcp", "tls-rust", "toml_config", "encoding"] }
regex = "1.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "json",
    "rustls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = { version = "3.1", features = ["full"] }
slug = "0.1"
# do not enable TLS support for SQLx or connections will just hang
# sjm 2025-07-28
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "postgres",
] }
tera = "2.4"
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
url = "2.5"


[build-dependencies]
anyhow = "1.0"
build-data = "0.3"

[dev-dependencies]
flate2 = "1.1"


[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3


[profile.minsize]
inherits = "release"
strip = true
opt-level = "z"
panic = "abort"

# EOF
